# /etc/nginx/sites-available/mango-shop  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# Replace example.com with your domain. HTTPS certificates: certbot --nginx -d example.com -d www.example.com

upstream mango_shop { server 127.0.0.1:3000; keepalive 32; }

# Basic protection for login and checkout endpoints (the app also rate-limits per IP).
limit_req_zone $binary_remote_addr zone=shop_sensitive:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    # certbot adds the redirect to HTTPS here; until then the site is served over HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # Managed by certbot:
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canonical host: send bare domain to www (or swap if you prefer the bare domain).
    if ($host = example.com) { return 301 https://www.example.com$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10m;   # keep slightly above MAX_UPLOAD_BYTES

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location = /api/users/login { limit_req zone=shop_sensitive burst=5 nodelay; proxy_pass http://mango_shop; include /etc/nginx/snippets/mango-proxy.conf; }

    location /_next/static/ {
        proxy_pass http://mango_shop;
        include /etc/nginx/snippets/mango-proxy.conf;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mango_shop;
        include /etc/nginx/snippets/mango-proxy.conf;
    }
}
